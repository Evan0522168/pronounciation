<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國語字音｜A、B、其他分類練習</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17253d;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px}
.wrap{max-width:760px;margin:auto}
h1{font-size:clamp(23px,5vw,30px);margin:8px 0}
h2{font-size:18px;margin:0 0 12px}
p{line-height:1.7}
.sub,.note{color:#53647c;font-size:14px}
.tabs,.actions,.categories,.filters{display:flex;gap:10px;flex-wrap:wrap}
.tabs{margin:20px 0 15px}
button,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:650}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
.tab,.secondary{background:#e5ecf5;color:#26384f}
.tab[aria-selected=true],.category[aria-pressed=true]{background:#2563eb;color:#fff}
.panel{background:#fff;border:1px solid #e1e8f1;border-radius:19px;padding:clamp(18px,5vw,30px);box-shadow:0 12px 30px #23314d0b}
.hidden{display:none!important}
.categories{margin-bottom:14px}
.category{flex:1;background:#e5ecf5;color:#26384f;min-width:90px}
.filters{margin:12px 0}
.filters label{display:flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid #c8d5e8;border-radius:10px;background:#f8fbff}
.filters input{width:18px;height:18px}
.counts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#486079;font-size:14px}
.card{display:block;width:100%;min-height:220px;background:#f8fbff;border:2px solid #dce8fa;margin:18px 0;text-align:center;color:#17253d;overflow-wrap:anywhere}
.word{display:block;font-size:clamp(30px,7vw,46px);font-weight:750;line-height:1.5}
.hint{display:block;color:#60728a;font-size:14px;margin-top:12px;line-height:1.7}
.card.revealed{background:#eaf3ff}
.card.revealed .word{color:#1558c1}
.actions button{flex:1;min-width:120px}
.red{background:#e54848;color:#fff}
.green{background:#07976d;color:#fff}
.dark{background:#26384f;color:#fff}
.wide{width:100%;margin-top:14px}
.tools{margin-top:24px;padding-top:20px;border-top:1px solid #e2e8f0}
textarea{width:100%;min-height:145px;border:1px solid #bdc9d9;border-radius:10px;padding:12px;font:14px/1.6 ui-monospace,monospace;resize:vertical}
.tools label{display:block;font-weight:650;margin-bottom:8px}
.status{font-size:14px;color:#175dc9;min-height:1.5em;line-height:1.7}
.question{text-align:center;background:#f8fbff;border:2px solid #dce8fa;border-radius:14px;padding:25px 16px;font-size:clamp(22px,5vw,28px);font-weight:700;line-height:1.8;margin:18px 0;overflow-wrap:anywhere}
.target{color:#175dc9;text-decoration:underline;text-underline-offset:5px}
.answer{border-radius:12px;padding:17px;background:#ecfdf5;line-height:1.8;margin-top:20px}
.answer.wrong{background:#fff0f0}
.answer p{margin:6px 0}
.quiz-settings{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0}
.quiz-settings label{display:flex;gap:7px;align-items:center}
select{padding:9px;border:1px solid #c8d5e8;border-radius:8px;background:#fff}
.footer{margin-top:18px;color:#60728a;font-size:13px;line-height:1.7}
.footer a{color:#1558c1}
.exam-item{border-top:1px solid #c8d5e8;padding:16px 0}
.exam-item:first-child{border:0}
.exam-item p{margin:6px 0}
.result-wrong{color:#b42318}
.result-right{color:#067647}
</style>
</head>
<body>
<main class="wrap">
  <h1>國語字音自主練習</h1>
  <p class="sub">
    閃卡一次背一類；練習與考試可以複選類別。
    選擇「已學會」或「再練一次」後，先看答案再進入下一張。
  </p>

  <div class="tabs" role="tablist" aria-label="練習模式">
    <button id="tab-card" class="tab" role="tab"
      aria-selected="true" aria-controls="panel-card">閃卡</button>
    <button id="tab-quiz" class="tab" role="tab"
      aria-selected="false" aria-controls="panel-quiz">練習／考試</button>
  </div>

  <section class="panel" id="panel-card"
    role="tabpanel" aria-labelledby="tab-card">
    <h2>選擇要背的類別</h2>

    <div class="categories" role="group" aria-label="閃卡類別（單選）">
      <button class="category" data-card-group="A"
        aria-pressed="true">A 類</button>
      <button class="category" data-card-group="B"
        aria-pressed="false">B 類</button>
      <button class="category" data-card-group="other"
        aria-pressed="false">其他</button>
    </div>

    <div class="counts">
      <span id="pending"></span>
      <span id="done"></span>
    </div>

    <button class="card" id="card" aria-label="點擊顯示或隱藏讀音">
      <span class="word" id="card-word"></span>
      <span class="hint" id="card-hint"></span>
    </button>

    <div class="actions">
      <button class="red" id="again">再練一次</button>
      <button class="green" id="know">已學會</button>
    </div>
    <button id="next-card" class="dark wide hidden">下一張</button>

    <div class="tools">
      <label for="input">複製／貼上待複習範圍</label>
      <textarea id="input"
        placeholder="可貼上上次匯出的進度，或字|注音|詞組，例如：愀|ㄑㄧㄠˇ|愀然"></textarea>

      <p class="note">
        「複製本類」只匯出目前類別尚未學會的項目；
        貼回載入後，省略的項目會視為已學會。
        單一類別的匯入只更新該類；
        A、B 共用的同一筆字卡共享進度。
      </p>

      <div class="actions">
        <button class="secondary" id="export">複製本類待複習</button>
        <button class="secondary" id="export-all">複製全部待複習</button>
        <button class="secondary" id="import">貼上後載入</button>
      </div>

      <div class="actions" style="margin-top:10px">
        <button class="secondary" id="reset">重設本類</button>
        <button class="secondary" id="undo" disabled>復原上次匯入／重設</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section class="panel hidden" id="panel-quiz"
    role="tabpanel" aria-labelledby="tab-quiz">
    <h2>選擇出題範圍（可複選）</h2>

    <div class="filters" role="group" aria-label="測驗類別">
      <label><input type="checkbox" value="A" checked>A 類</label>
      <label><input type="checkbox" value="B">B 類</label>
      <label><input type="checkbox" value="other">其他</label>
    </div>

    <p class="note" id="quiz-scope"></p>

    <div class="quiz-settings">
      <label>
        模式
        <select id="quiz-mode">
          <option value="practice">即時練習</option>
          <option value="exam">考試</option>
        </select>
      </label>

      <label id="exam-length-label" class="hidden">
        題數
        <select id="exam-length">
          <option value="10">10 題</option>
          <option value="20">20 題</option>
          <option value="30">30 題</option>
        </select>
      </label>
    </div>

    <p class="note" id="mode-hint">作答後立即顯示解答。</p>

    <div class="counts">
      <span id="quiz-count"></span>
      <span id="quiz-score"></span>
    </div>

    <button id="start-exam" class="dark wide hidden">開始考試</button>
    <div class="question" id="question"></div>

    <div class="actions hidden" id="choices">
      <button class="green" id="same">⭕ 相同</button>
      <button class="red" id="different">❌ 不同</button>
    </div>

    <div id="feedback" class="answer hidden" aria-live="polite"></div>
    <button id="next" class="dark wide hidden">下一題</button>
    <div id="exam-results" class="hidden" aria-live="polite"></div>
  </section>

  <p class="footer">
    進度會保留在此瀏覽器，換裝置前請複製匯出。
    類別依前次選文字詞清單整理，字卡例詞可能是延伸詞；
    不同讀音的詞組分開背。
    其他類沿用現有題庫，尚未做本次逐篇出處核驗。
    <br>
    <a href="https://dict.concised.moe.edu.tw/"
      target="_blank" rel="noopener">教育部國語辭典簡編本</a>
    ·
    <a href="https://dict.revised.moe.edu.tw/"
      target="_blank" rel="noopener">重編國語辭典修訂本</a>
  </p>
</main>

const $=id=>document.getElementById(id);

function groupsFor(x){
  const exact={
    "施行":["A","B"],
    "妄自菲薄":["A"],
    "菲律賓":["B"],
    "逆閹":["B"],
    "膝之所踦":["A"],
    "禍倡於匪徒":["A"],
    "代繳":["A"]
  };
  if(exact[x.phrase])return exact[x.phrase];
  if(EXPLICIT_GROUPS[x.phrase])return EXPLICIT_GROUPS[x.phrase];
  const found=["A","B"].filter(g=>GROUP_KEYS[g].includes(x.char));
  return found.length?found:["other"];
}

const baseRows=DATA.split("\n").map(line=>
  line.trim().split(/\s+/).filter(Boolean).map(token=>{
    const [char,reading,phrase]=token.split("|");
    const item={char,reading,phrase};
    item.groups=groupsFor(item);
    return item;
  })
);

const allItems=unique(baseRows.flat());
const itemMap=new Map(allItems.map(x=>[key(x),x]));

const NOTES={
  "咯|ㄎㄚˇ|咯血":"簡編本：ㄎㄚˇ；重編本另列 ㄌㄨㄛˋ。",
  "驁|ㄠˊ|桀驁":"簡編本：ㄠˊ；重編本詞條另列 ㄠˋ（又音）。",
  "畦|ㄑㄧˊ|田畦":"簡編本：ㄑㄧˊ；重編本另分語音、讀音。",
  "瞿|ㄑㄩ|瞿先生":"重編本姓氏正讀 ㄑㄩ，另列 ㄑㄩˊ 為又音。"
};

let pending=allItems.map(key);
let known=new Set();
let cardGroup="A";
let quizGroups=["A"];
let quizMode="practice";

let currentCard=null;
let cardAnswered=false;
let cardRevealed=false;
let quiz=null;
let quizN=0;
let correctN=0;
let seenPairs=new Set();
let exam=null;
let undoState=null;
let examAnswerLocked=false;

function setStatus(text){
  $("status").textContent=text;
}

function snapshot(){
  return {
    pending:[...pending],
    known:[...known],
    cardGroup,
    quizGroups:[...quizGroups],
    quizMode
  };
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshot()));
  }catch{
    setStatus("無法自動儲存；請複製待複習範圍保存。");
  }
}

function applyState(state){
  const p=Array.isArray(state.pending)?state.pending:[];
  const k=Array.isArray(state.known)?state.known:[];

  pending=[...new Set(p.filter(id=>itemMap.has(id)))];
  known=new Set(k.filter(id=>itemMap.has(id)&&!pending.includes(id)));

  for(const x of allItems){
    if(!pending.includes(key(x))&&!known.has(key(x))){
      pending.push(key(x));
    }
  }

  cardGroup=GROUP_NAMES[state.cardGroup]?state.cardGroup:"A";
  quizGroups=Array.isArray(state.quizGroups)
    ?[...new Set(state.quizGroups.filter(g=>GROUP_NAMES[g]))]
    :["A"];
  quizMode=state.quizMode==="exam"?"exam":"practice";
}

function restore(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved&&Array.isArray(saved.pending)&&Array.isArray(saved.known)){
      applyState(saved);
      return;
    }

    const legacy=JSON.parse(localStorage.getItem("zhuyin-practice-v3"));
    if(legacy&&Array.isArray(legacy.pending)&&Array.isArray(legacy.done)){
      const included=new Set(
        (Array.isArray(legacy.clusters)?legacy.clusters.flat():[])
          .filter(x=>x&&x.char).map(key)
      );

      const oldKeys=new Set(
        DATA.split("\n")
          .flatMap(line=>line.trim().split(/\s+/))
          .filter(Boolean)
      );

      const p=legacy.pending.filter(x=>x&&x.char).map(key);
      const k=legacy.done.filter(x=>x&&x.char).map(key);
      const added=[
        "施行","妄自菲薄","菲律賓","逆閹",
        "膝之所踦","禍倡於匪徒","代繳"
      ];

      if(included.size){
        for(const id of oldKeys){
          if(!included.has(id)&&!p.includes(id)&&!k.includes(id)){
            const item=itemMap.get(id);
            if(item&&!added.includes(item.phrase))k.push(id);
          }
        }
      }

      applyState({pending:p,known:k});
    }
  }catch{}
}

function matches(x,groups){
  return x.groups.some(g=>groups.includes(g));
}

function pendingItems(groups){
  return pending.map(id=>itemMap.get(id))
    .filter(x=>x&&matches(x,groups));
}

function syncControls(){
  document.querySelectorAll("[data-card-group]").forEach(b=>{
    b.setAttribute(
      "aria-pressed",
      String(b.dataset.cardGroup===cardGroup)
    );
  });

  document.querySelectorAll(".filters input").forEach(c=>{
    c.checked=quizGroups.includes(c.value);
  });

  $("quiz-mode").value=quizMode;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function label(x){
  const i=x.phrase.indexOf(x.char);
  if(i<0)return escapeHtml(x.phrase);

  return escapeHtml(x.phrase.slice(0,i))
    +`<span class="target">${escapeHtml(x.char)}</span>`
    +escapeHtml(x.phrase.slice(i+x.char.length));
}

function cardHint(x){
  return `「${x.char}」・${x.phrase}・`
    +x.groups.map(g=>GROUP_NAMES[g]).join("／")
    +(NOTES[key(x)]?"；"+NOTES[key(x)]:"");
}

function updateCounts(){
  const count=pendingItems([cardGroup]).length;
  const done=allItems.filter(x=>
    matches(x,[cardGroup])&&known.has(key(x))
  ).length;

  $("pending").textContent=`${GROUP_NAMES[cardGroup]}待複習：${count}`;
  $("done").textContent=`已學會：${done}`;
}

function renderCard(){
  currentCard=pendingItems([cardGroup])[0]||null;
  cardAnswered=false;
  cardRevealed=false;
  updateCounts();

  $("card").classList.remove("revealed");
  $("card-word").innerHTML=currentCard
    ?label(currentCard)
    :"🎉 本類已全部學會";

  $("card-hint").textContent=currentCard
    ?"點擊查看讀音，或先選擇熟悉程度"
    :"可以選其他類，或重設本類。";

  $("again").disabled=$("know").disabled=!currentCard;
  $("next-card").classList.add("hidden");
}

function revealCard(){
  if(!currentCard)return;
  cardRevealed=true;
  $("card").classList.add("revealed");
  $("card-word").textContent=currentCard.reading;
  $("card-hint").textContent=cardHint(currentCard);
}

function answerCard(isKnown){
  if(!currentCard||cardAnswered)return;

  cardAnswered=true;
  const id=key(currentCard);
  pending=pending.filter(k=>k!==id);

  if(isKnown)known.add(id);
  else pending.push(id);

  revealCard();
  $("card-hint").textContent+=isKnown
    ?"；已標記「已學會」"
    :"；已排到本類後面再練";

  $("again").disabled=$("know").disabled=true;
  $("next-card").classList.remove("hidden");
  updateCounts();
  save();
}

$("card").onclick=()=>{
  if(!currentCard)return;
  if(cardAnswered||!cardRevealed){
    revealCard();
  }else{
    cardRevealed=false;
    $("card").classList.remove("revealed");
    $("card-word").innerHTML=label(currentCard);
    $("card-hint").textContent="點擊查看讀音";
  }
};

$("again").onclick=()=>answerCard(false);
$("know").onclick=()=>answerCard(true);
$("next-card").onclick=renderCard;

document.querySelectorAll("[data-card-group]").forEach(b=>{
  b.onclick=()=>{
    cardGroup=b.dataset.cardGroup;
    syncControls();
    renderCard();
    save();
  };
});

function serializePending(scope){
  const groups=scope==="ALL"?Object.keys(GROUP_NAMES):[scope];
  const keep=new Set(pendingItems(groups).map(key));
  const seen=new Set();

  const lines=baseRows.map(row=>
    row.filter(x=>{
      const id=key(x);
      if(!keep.has(id)||seen.has(id))return false;
      seen.add(id);
      return true;
    }).map(key).join(" ")
  ).filter(Boolean);

  return [
    "# 字音進度 v4",
    `# scope=${scope}`,
    "# 僅列尚未學會的項目；空清單代表本範圍已學會。",
    ...lines
  ].join("\n");
}

async function copyPending(scope){
  $("input").value=serializePending(scope);
  $("input").focus();
  $("input").select();

  try{
    if(!navigator.clipboard||!window.isSecureContext)throw new Error();
    await navigator.clipboard.writeText($("input").value);
    setStatus(
      `已複製${scope==="ALL"?"全部類別":GROUP_NAMES[scope]}的待複習範圍。`
    );
  }catch{
    setStatus("文字已放入並選取；請手動複製。");
  }
}

$("export").onclick=()=>copyPending(cardGroup);
$("export-all").onclick=()=>copyPending("ALL");

function parseInput(text){
  const items=[];
  const unknown=[];
  let scope=null;
  let hasData=false;

  for(let line of text.replace(/｜/g,"|").split(/\r?\n/)){
    line=line.trim();
    if(!line||line==="字音")continue;

    if(line.startsWith("#")){
      const m=line.match(/^#\s*scope=(\S+)\s*$/);
      if(m){
        if(scope&&scope!==m[1]){
          return {error:"進度標頭的範圍互相矛盾。"};
        }
        scope=m[1];
      }
      continue;
    }

    hasData=true;

    if(line.includes("|")){
      for(const token of line.split(/\s+/)){
        const x=itemMap.get(token);
        if(x)items.push(x);
        else unknown.push(token);
      }
    }else{
      const tokens=line.match(
        /[^（）()／/\s]+(?:[（(][^）)]+[）)])?/gu
      )||[];

      for(const token of tokens){
        const match=token.match(/^([^（(]+)(?:[（(](.+)[）)])?$/u);
        if(!match){
          unknown.push(token);
          continue;
        }

        const contexts=match[2]
          ?match[2].split(/[／/]/).map(s=>s.trim())
          :[];

        for(const char of [...match[1]]){
          const options=allItems.filter(x=>x.char===char);
          const relevant=contexts.filter(p=>p.includes(char));
          const chosen=relevant.length
            ?options.filter(x=>relevant.includes(x.phrase))
            :options;

          if(chosen.length)items.push(...chosen);
          else unknown.push(
            relevant.length
              ?`${char}（${relevant.join("／")}）`
              :char
          );
        }
      }
    }
  }

  if(scope&&!["A","B","other","ALL"].includes(scope)){
    return {error:"無法辨識進度檔類別。"};
  }

  return {items:unique(items),unknown,scope,hasData};
}

function rememberUndo(){
  undoState=snapshot();
  $("undo").disabled=false;
}

function replaceScope(scope,items){
  const groups=scope==="ALL"?Object.keys(GROUP_NAMES):[scope];
  const accepted=items.filter(x=>matches(x,groups));
  const acceptedKeys=new Set(accepted.map(key));
  const affected=allItems.filter(x=>matches(x,groups));
  const affectedKeys=new Set(affected.map(key));

  pending=pending.filter(id=>!affectedKeys.has(id));

  for(const x of affected){
    const id=key(x);
    if(acceptedKeys.has(id)){
      known.delete(id);
      pending.push(id);
    }else{
      known.add(id);
    }
  }

  return accepted.length;
}

$("import").onclick=()=>{
  const text=$("input").value.trim();
  if(!text){
    setStatus("請先貼上進度文字。");
    return;
  }

  const parsed=parseInput(text);
  if(parsed.error){
    setStatus(parsed.error);
    return;
  }

  if(!parsed.items.length&&(parsed.hasData||!parsed.scope)){
    setStatus("沒有可辨識的題庫項目；進度未變更。");
    return;
  }

  const scope=parsed.scope||cardGroup;
  const groups=scope==="ALL"?Object.keys(GROUP_NAMES):[scope];
  const accepted=parsed.items.filter(x=>matches(x,groups));

  if(parsed.items.length&&!accepted.length){
    setStatus(
      "貼上的項目不屬於此類；請選對類別或貼上含範圍標頭的匯出文字。"
    );
    return;
  }

  rememberUndo();
  const count=replaceScope(scope,accepted);
  if(scope!=="ALL")cardGroup=scope;

  syncControls();
  renderCard();
  resetQuiz();
  save();

  const skipped=parsed.unknown.length
    +parsed.items.length-accepted.length;

  setStatus(
    `已載入${scope==="ALL"?"全部類別":GROUP_NAMES[scope]}：`
    +`${count} 項待複習；其餘本範圍項目已標記學會。`
    +(skipped?` 略過 ${skipped} 個不符項目。`:"")
  );
};

$("reset").onclick=()=>{
  rememberUndo();
  const affected=allItems.filter(x=>matches(x,[cardGroup]));
  replaceScope(cardGroup,affected);
  renderCard();
  resetQuiz();
  save();
  setStatus(`已重設${GROUP_NAMES[cardGroup]}；可以按「復原」撤銷。`);
};

$("undo").onclick=()=>{
  if(!undoState)return;
  applyState(undoState);
  undoState=null;
  $("undo").disabled=true;
  syncControls();
  renderCard();
  resetQuiz();
  save();
  setStatus("已復原上次匯入／重設前的進度。");
};

function pairId(a,b){
  return [key(a),key(b)].sort().join("\n");
}

function pairPool(){
  const items=pendingItems(quizGroups);
  const pairs=[];

  for(let i=0;i<items.length;i++){
    for(let j=i+1;j<items.length;j++){
      pairs.push({
        a:items[i],
        b:items[j],
        same:items[i].reading===items[j].reading,
        id:pairId(items[i],items[j])
      });
    }
  }

  return pairs;
}

function pickPair(pairs){
  const same=pairs.filter(x=>x.same);
  const different=pairs.filter(x=>!x.same);

  const pool=same.length&&different.length
    ?(Math.random()<.5?same:different)
    :pairs;

  const picked=pool[Math.floor(Math.random()*pool.length)];
  return {...picked,answered:false};
}

function updateQuizScope(){
  const n=pendingItems(quizGroups).length;

  $("quiz-scope").textContent=
    `範圍：${quizGroups.length
      ?quizGroups.map(g=>GROUP_NAMES[g]).join("＋")
      :"尚未選擇"}；${n} 項待複習。`
    +"同一筆 A／B 共用字卡只計一次；已學會項目不出題。";

  return n;
}

function showQuestion(q){
  $("question").innerHTML=`${label(q.a)}<br>／<br>${label(q.b)}`;
  $("choices").classList.remove("hidden");
}

function clearQuizUI(){
  quiz=null;
  exam=null;
  $("feedback").classList.add("hidden");
  $("next").classList.add("hidden");
  $("choices").classList.add("hidden");
  $("exam-results").classList.add("hidden");
  $("exam-results").textContent="";
}

function resetQuiz(){
  clearQuizUI();
  examAnswerLocked=false;
  $("same").disabled=$("different").disabled=false;
  $("start-exam").textContent="開始考試";
  quizN=correctN=0;
  seenPairs.clear();

  const n=updateQuizScope();
  const isExam=quizMode==="exam";

  $("exam-length-label").classList.toggle("hidden",!isExam);
  $("start-exam").classList.toggle("hidden",!isExam);
  $("start-exam").disabled=n<2;

  $("mode-hint").textContent=isExam
    ?"作答後自動進入下一題，全部完成後一起看分數與解答。"
    :"作答後立即顯示解答；同音與不同音題型盡量均衡。";

  if(isExam){
    $("quiz-count").textContent="考試尚未開始";
    $("quiz-score").textContent="";
    $("question").textContent=n<2
      ?(quizGroups.length
        ?"至少需要兩項待複習字詞。"
        :"請先勾選類別。")
      :"準備好後按「開始考試」。";
  }else{
    generatePractice();
  }
}

function generatePractice(){
  $("feedback").classList.add("hidden");
  $("next").classList.add("hidden");

  const all=pairPool();
  updateQuizScope();
  $("quiz-count").textContent=`第 ${quizN+1} 題`;
  $("quiz-score").textContent=`答對 ${correctN}／${quizN} 題`;

  if(!all.length){
    quiz=null;
    $("question").textContent=quizGroups.length
      ?"至少需要兩項待複習字詞。"
      :"請先勾選類別。";
    $("choices").classList.add("hidden");
    return;
  }

  let pool=all.filter(x=>!seenPairs.has(x.id));
  if(!pool.length){
    seenPairs.clear();
    pool=all;
  }

  quiz=pickPair(pool);
  seenPairs.add(quiz.id);
  showQuestion(quiz);
}

function detail(q){
  return `<p>「${escapeHtml(q.a.char)}」`
    +`（${escapeHtml(q.a.phrase)}）：${escapeHtml(q.a.reading)}</p>`
    +`<p>「${escapeHtml(q.b.char)}」`
    +`（${escapeHtml(q.b.phrase)}）：${escapeHtml(q.b.reading)}</p>`
    +`<p>正確答案：${q.same?"相同":"不同"}</p>`
    +[q.a,q.b].map(x=>
      NOTES[key(x)]?`<p>${escapeHtml(NOTES[key(x)])}</p>`:""
    ).join("");
}

function startExam(){
  const pool=pairPool();
  if(!pool.length)return;

  const count=Math.min(Number($("exam-length").value),pool.length);
  const selected=[];
  const used=new Set();

  for(let i=0;i<count;i++){
    const q=pickPair(pool.filter(x=>!used.has(x.id)));
    used.add(q.id);
    selected.push(q);
  }

  clearQuizUI();
  examAnswerLocked=false;
  $("same").disabled=$("different").disabled=false;
  exam={questions:selected,answers:[],index:0};
  $("start-exam").classList.add("hidden");
  $("quiz-score").textContent="作答中";
  renderExamQuestion();
}

function renderExamQuestion(){
  quiz=exam.questions[exam.index];
  $("quiz-count").textContent=
    `考試第 ${exam.index+1}／${exam.questions.length} 題`;
  showQuestion(quiz);
}

function finishExam(){
  const correct=exam.answers.filter(x=>x.correct).length;
  const total=exam.questions.length;

  $("choices").classList.add("hidden");
  $("question").textContent="考試完成";
  $("quiz-count").textContent=`已完成 ${total} 題`;
  $("quiz-score").textContent=
    `答對 ${correct}／${total} 題（${Math.round(correct/total*100)} 分）`;

  $("exam-results").innerHTML=exam.answers.map((ans,i)=>
    `<div class="exam-item">`
    +`<strong class="${ans.correct?"result-right":"result-wrong"}">`
    +`第 ${i+1} 題：${ans.correct?"答對":"答錯"}</strong>`
    +`<p>${label(ans.question.a)}／${label(ans.question.b)}</p>`
    +`<p>你的答案：${ans.choice?"相同":"不同"}</p>`
    +detail(ans.question)
    +`</div>`
  ).join("");

  $("exam-results").classList.remove("hidden");
  $("start-exam").textContent="再考一次";
  $("start-exam").classList.remove("hidden");
  quiz=null;
}

function submit(choice){
  if(!quiz||quiz.answered||examAnswerLocked)return;

  quiz.answered=true;
  const good=choice===quiz.same;

  if(quizMode==="exam"&&exam){
    examAnswerLocked=true;
    $("same").disabled=$("different").disabled=true;

    setTimeout(()=>{
      examAnswerLocked=false;
      $("same").disabled=$("different").disabled=false;
    },250);

    exam.answers.push({question:quiz,choice,correct:good});
    exam.index++;

    if(exam.index===exam.questions.length)finishExam();
    else renderExamQuestion();
    return;
  }

  quizN++;
  if(good)correctN++;

  $("feedback").className="answer"+(good?"":" wrong");
  $("feedback").innerHTML=
    `<strong>${good?"⭕ 答對了":"❌ 答錯了"}</strong>`+detail(quiz);

  $("choices").classList.add("hidden");
  $("next").classList.remove("hidden");
  $("quiz-score").textContent=`答對 ${correctN}／${quizN} 題`;
}

$("same").onclick=()=>submit(true);
$("different").onclick=()=>submit(false);
$("next").onclick=generatePractice;
$("start-exam").onclick=startExam;

document.querySelectorAll(".filters input").forEach(c=>{
  c.onchange=()=>{
    quizGroups=[...document.querySelectorAll(".filters input:checked")]
      .map(x=>x.value);
    resetQuiz();
    save();
  };
});

$("quiz-mode").onchange=()=>{
  quizMode=$("quiz-mode").value;
  resetQuiz();
  save();
};

$("exam-length").onchange=resetQuiz;

for(const [name,other] of [["card","quiz"],["quiz","card"]]){
  $("tab-"+name).onclick=()=>{
    $("panel-"+name).classList.remove("hidden");
    $("panel-"+other).classList.add("hidden");
    $("tab-"+name).setAttribute("aria-selected","true");
    $("tab-"+other).setAttribute("aria-selected","false");
    if(name==="quiz")resetQuiz();
  };
}

restore();
syncControls();
renderCard();
resetQuiz();
save();
</script>
</body>
</html>
