<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字音練習與閃卡系統</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --secondary: #166088;
            --success: #2ec4b6;
            --danger: #e63946;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2b2d42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .mode-section {
            display: none;
        }

        .mode-section.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Flashcard Controls & Card */
        .card-container {
            width: 100%;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
            margin: 20px 0;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            border: 2px solid var(--primary);
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f0f7ff;
        }

        .char-text {
            font-size: 42px;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .pinyin-text {
            font-size: 28px;
            color: var(--danger);
            font-weight: bold;
        }

        .word-text {
            font-size: 20px;
            color: #555;
            margin-top: 10px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .action-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .btn-know { background-color: var(--success); }
        .btn-unknow { background-color: var(--danger); }
        .btn-circle { background-color: var(--success); font-size: 24px; width: 100px; }
        .btn-cross { background-color: var(--danger); font-size: 24px; width: 100px; }

        .progress-text {
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }

        .io-group {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
            width: 100%;
            justify-content: center;
        }

        .io-btn {
            padding: 6px 12px;
            font-size: 13px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Practice Quiz Style */
        .quiz-question {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .quiz-target {
            font-size: 28px;
            font-weight: bold;
            color: var(--secondary);
            margin: 10px 0;
            padding: 10px;
            background: #eef4f8;
            border-radius: 8px;
            display: inline-block;
        }

        .quiz-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            text-align: center;
            display: none;
        }

        .quiz-result.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .quiz-result.wrong {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .detail-info {
            margin-top: 10px;
            font-size: 16px;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>高額國語字音字形練習系統</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchMode('flashcard')">Flashcard 閃卡庫</button>
            <button class="tab-btn" onclick="switchMode('quiz')">是非題練習</button>
        </div>
    </header>

    <div class="container">
        <!-- 閃卡模式 -->
        <div id="flashcard-mode" class="mode-section active">
            <div class="progress-text" id="fc-progress">剩餘未熟練：0 / 已學會：0</div>
            
            <div class="card-container" onclick="flipCard()">
                <div class="card" id="flashcard">
                    <div class="card-front">
                        <div class="char-text" id="fc-word">字詞載入中...</div>
                        <p style="color: #888; font-size: 12px;">(點擊卡片翻面看讀音)</p>
                    </div>
                    <div class="card-back">
                        <div class="pinyin-text" id="fc-pinyin">讀音</div>
                        <div class="word-text" id="fc-detail">詞組說明</div>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="action-btn btn-unknow" onclick="markCard(false)">還沒記住 ❌</button>
                <button class="action-btn btn-know" onclick="markCard(true)">已經學會 ⭕</button>
            </div>

            <div class="io-group">
                <button class="io-btn" onclick="exportData()">匯出進度</button>
                <button class="io-btn" onclick="document.getElementById('importFile').click()">匯入進度</button>
                <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
            </div>
        </div>

        <!-- 是非題練習模式 -->
        <div id="quiz-mode" class="mode-section">
            <div class="quiz-question">
                請判斷以下兩個字詞的<br><strong>【主要讀音/聲調是否相同】</strong>：
                <div class="quiz-target" id="quiz-target-text">載入中...</div>
            </div>

            <div class="btn-group" id="quiz-btns">
                <button class="action-btn btn-circle" onclick="submitAnswer(true)">⭕</button>
                <button class="action-btn btn-cross" onclick="submitAnswer(false)">❌</button>
            </div>

            <div id="quiz-result" class="quiz-result">
                <div id="quiz-status" style="font-size: 20px; font-weight: bold;"></div>
                <div id="quiz-detail" class="detail-info"></div>
                <button class="action-btn" style="background: var(--primary); margin-top: 15px;" onclick="nextQuiz()">下一題</button>
            </div>
        </div>
    </div>

        ];

        // 扁平化並去重建立 Flashcard List
        let allItems = [];
        const seen = new Set();
        rawGroups.forEach(group => {
            group.forEach(item => {
                if (!seen.has(item.w)) {
                    seen.add(item.w);
                    allItems.push(item);
                }
            });
        });

        // Flashcard 狀態
        let unlearned = [...allItems];
        let learned = [];
        let currentFCIndex = 0;

        // Quiz 狀態
        let currentQuiz = null;

        // --- 初始化頁面 ---
        window.onload = function() {
            updateFCDisplay();
            generateQuiz();
        };

        // --- 切換分頁 ---
        function switchMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.mode-section').forEach(s => s.classList.remove('active'));
            
            if (mode === 'flashcard') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('flashcard-mode').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('quiz-mode').classList.add('active');
            }
        }

        // --- Flashcard 邏輯 ---
        function updateFCDisplay() {
            document.getElementById('fc-progress').innerText = 
                `剩餘未熟練：${unlearned.length} / 已學會：${learned.length}`;

            const card = document.getElementById('flashcard');
            card.classList.remove('flipped');

            if (unlearned.length === 0) {
                document.getElementById('fc-word').innerText = "🎉 全數完畢！";
                document.getElementById('fc-pinyin').innerText = "太棒了";
                document.getElementById('fc-detail').innerText = "您已經學會此範圍的所有字音！";
                return;
            }

            if (currentFCIndex >= unlearned.length) {
                currentFCIndex = 0;
            }

            const item = unlearned[currentFCIndex];
            document.getElementById('fc-word').innerText = item.w;
            document.getElementById('fc-pinyin').innerText = item.p;
            document.getElementById('fc-detail').innerText = item.d;
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function markCard(isKnow) {
            if (unlearned.length === 0) return;

            const item = unlearned.splice(currentFCIndex, 1)[0];
            if (isKnow) {
                learned.push(item);
            } else {
                unlearned.push(item); // 放回隊尾
            }
            updateFCDisplay();
        }

        // 匯出 / 匯入
        function exportData() {
            const data = { unlearned, learned };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "phonetic_progress.json";
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.unlearned && data.learned) {
                        unlearned = data.unlearned;
                        learned = data.learned;
                        currentFCIndex = 0;
                        updateFCDisplay();
                        alert("進度載入成功！");
                    }
                } catch (err) {
                    alert("檔案格式錯誤！");
                }
            };
            reader.readAsText(file);
        }

        // --- 是非題 Quiz 邏輯 ---
        function generateQuiz() {
            // 選取一個至少有2個元素的橫排
            const validGroups = rawGroups.filter(g => g.length >= 2);
            const selectedGroup = validGroups[Math.floor(Math.random() * validGroups.length)];

            // 隨機取出橫排中的兩個元素
            let idx1 = Math.floor(Math.random() * selectedGroup.length);
            let idx2 = Math.floor(Math.random() * selectedGroup.length);
            while (idx1 === idx2) {
                idx2 = Math.floor(Math.random() * selectedGroup.length);
            }

            const item1 = selectedGroup[idx1];
            const item2 = selectedGroup[idx2];

            // 判斷兩者讀音是否完全相同 (以主要聲調/拼音是否相同判斷)
            const isSame = item1.p === item2.p;

            currentQuiz = { item1, item2, isSame };

            // 渲染介面
            document.getElementById('quiz-target-text').innerText = `${item1.w}  與  ${item2.w}`;
            document.getElementById('quiz-result').style.display = 'none';
            document.getElementById('quiz-btns').style.display = 'flex';
        }

        function submitAnswer(userAnswer) {
            const isCorrect = (userAnswer === currentQuiz.isSame);
            const resultBox = document.getElementById('quiz-result');
            const statusBox = document.getElementById('quiz-status');
            const detailBox = document.getElementById('quiz-detail');

            resultBox.style.display = 'block';
            document.getElementById('quiz-btns').style.display = 'none';

            if (isCorrect) {
                resultBox.className = 'quiz-result correct';
                statusBox.innerText = "⭕ 答對了！";
            } else {
                resultBox.className = 'quiz-result wrong';
                statusBox.innerText = "❌ 答錯囉！";
            }

            detailBox.innerHTML = `
                <div><strong>【${currentQuiz.item1.w}】</strong> 讀音：<span style="color:red;">${currentQuiz.item1.p}</span> (${currentQuiz.item1.d})</div>
                <div><strong>【${currentQuiz.item2.w}】</strong> 讀音：<span style="color:red;">${currentQuiz.item2.p}</span> (${currentQuiz.item2.d})</div>
                <div style="margin-top:8px; font-weight:bold;">兩者讀音：${currentQuiz.isSame ? "相同 ⭕" : "不同 ❌"}</div>
            `;
        }

        function nextQuiz() {
            generateQuiz();
        }
    </script>
