<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國文字音字形複習器</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --secondary: #166088;
            --success: #2ec4b6;
            --danger: #e71d36;
            --bg: #f8f9fa;
            --card: #ffffff;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2, h3 { text-align: center; color: var(--secondary); }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .section { display: none; }
        .section.active { display: block; }

        .form-group {
            margin-bottom: 15px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 8px;
        }

        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-success { background: var(--success); }
        .btn-secondary { background: #6c757d; }

        .btn:hover { opacity: 0.9; }

        .sync-box {
            background: #e7f5ff;
            border: 1px solid #a5d8ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            text-align: left;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #e7f5ff;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result-box.correct { background: #d4edda; color: #155724; }
        .result-box.wrong { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>國文字音字形複習器</h1>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('input-section')">功能一：輸入新詞</button>
        <button class="tab-btn" onclick="switchTab('quiz-setup')">功能二：開始測驗</button>
        <button class="tab-btn" onclick="switchTab('sync-section')">跨裝置同步</button>
    </div>

    <!-- 功能一：新增資料 -->
    <div id="input-section" class="section active">
        <h2>建立與擴充題庫</h2>
        
        <div class="form-group">
            <h3>新增【字音類】</h3>
            <label>測驗字（1字）</label>
            <input type="text" id="phonetic-char" maxlength="1" placeholder="例如：施">
            <label>讀音</label>
            <input type="text" id="phonetic-pron" placeholder="例如：ㄕ">
            <label>包含該字的詞語</label>
            <input type="text" id="phonetic-word" placeholder="例如：椸施（施及）">
            <label>字音類別代號（1字）</label>
            <input type="text" id="phonetic-cat" maxlength="1" placeholder="例如：A">
            <button class="btn" onclick="addPhonetic()">儲存字音資料</button>
        </div>

        <div class="form-group">
            <h3>新增【字形類】（兩筆為一組）</h3>
            <h4>[第 1 組]</h4>
            <input type="text" id="shape-char1" maxlength="1" placeholder="測驗字 1 (例：辨)">
            <input type="text" id="shape-pron1" placeholder="讀音 1 (例：ㄅㄧㄢˋ)">
            <input type="text" id="shape-word1" placeholder="詞語 1 (例：分辨)">
            
            <h4>[第 2 組]</h4>
            <input type="text" id="shape-char2" maxlength="1" placeholder="測驗字 2 (例：辯)">
            <input type="text" id="shape-pron2" placeholder="讀音 2 (例：ㄅㄧㄢˋ)">
            <input type="text" id="shape-word2" placeholder="詞語 2 (例：辯論)">
            
            <button class="btn" onclick="addShapePair()">儲存字形對照組</button>
        </div>

        <div>
            <h3>目前題庫統計</h3>
            <p>字音資料：<span id="count-phonetic">0</span> 筆 | 字形對照：<span id="count-shape">0</span> 組</p>
        </div>
    </div>

    <!-- 跨裝置同步區塊 -->
    <div id="sync-section" class="section">
        <h2>跨裝置資料同步</h2>
        <div class="sync-box">
            <h3>匯出 / 匯入 備份檔</h3>
            <p>可將包含答對紀錄與最新詞語的題庫下載為 JSON 檔案，傳至其他裝置讀取。</p>
            <button class="btn btn-success" onclick="exportData()">匯出題庫備份檔 (.json)</button>
            <br><br>
            <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
            <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">匯入題庫備份檔 (.json)</button>
        </div>
    </div>

    <!-- 功能二：測驗設定與測驗區 -->
    <div id="quiz-setup" class="section">
        <div id="setup-panel">
            <h2>測驗設定</h2>
            <div class="form-group">
                <label>選擇類別：</label>
                <select id="quiz-cat-select">
                    <option value="all">全部（字音+字形）</option>
                    <option value="phonetic">僅字音類</option>
                    <option value="shape">僅字形類</option>
                </select>

                <label>選擇題型：</label>
                <select id="quiz-type-select">
                    <option value="random">隨機混合題型</option>
                    <option value="1">1. 字音單選</option>
                    <option value="2">2. 字音多選</option>
                    <option value="3">3. 字形單選</option>
                    <option value="4">4. 改錯題</option>
                    <option value="5">5. 字音填空</option>
                    <option value="6">6. 字形填空</option>
                </select>

                <label>題目數量：</label>
                <select id="quiz-amount-select">
                    <option value="10">10 題</option>
                    <option value="20">20 題</option>
                    <option value="999">不中斷（直到手動停止）</option>
                </select>

                <button class="btn" onclick="startQuiz()">開始測驗</button>
            </div>
        </div>

        <div id="quiz-panel" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="quiz-progress">題目 1</h3>
            </div>
            <hr>
            <div id="question-box"></div>
            <button id="submit-btn" class="btn" style="margin-top:20px;" onclick="submitAnswer()">提交答案</button>
            
            <div id="result-box" class="result-box">
                <div id="result-text"></div>
                <button class="btn btn-secondary" style="margin-top:10px;" onclick="nextQuestion()">下一題</button>
            </div>
        </div>
    </div>
</div>

    phonetic: JSON.parse(localStorage.getItem('db_phonetic')) || defaultPhoneticList,
    shapePairs: JSON.parse(localStorage.getItem('db_shape')) || []

}

function updateSummary() {
    document.getElementById('count-phonetic').innerText = db.phonetic.length;
    document.getElementById('count-shape').innerText = db.shapePairs.length;
}
updateSummary();

function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(tabId).classList.add('active');
}

function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `chinese_quiz_backup_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

function importData(event) {
    const fileReader = new FileReader();
    fileReader.onload = function(e) {
        try {
            const importedDb = JSON.parse(e.target.result);
            if (importedDb.phonetic && importedDb.shapePairs) {
                db = importedDb;
                saveData();
                alert('備份檔案匯入成功！資料已更新。');
            } else {
                alert('檔案格式不相符！');
            }
        } catch(err) {
            alert('無法解析此檔案！');
        }
    };
    fileReader.readAsText(event.target.files[0]);
}

function addPhonetic() {
    const char = document.getElementById('phonetic-char').value.trim();
    const pron = document.getElementById('phonetic-pron').value.trim();
    const word = document.getElementById('phonetic-word').value.trim();
    const cat = document.getElementById('phonetic-cat').value.trim();

    if(!char || !pron || !word || !cat) return alert('請完整填寫字音資料！');

    db.phonetic.push({ id: 'p_' + Date.now(), char, pron, word, cat, streak: 0, wrongCount: 0 });
    saveData();
    alert('字音資料新增成功！');
    ['phonetic-char','phonetic-pron','phonetic-word','phonetic-cat'].forEach(id => document.getElementById(id).value = '');
}

function addShapePair() {
    const c1 = document.getElementById('shape-char1').value.trim();
    const p1 = document.getElementById('shape-pron1').value.trim();
    const w1 = document.getElementById('shape-word1').value.trim();
    const c2 = document.getElementById('shape-char2').value.trim();
    const p2 = document.getElementById('shape-pron2').value.trim();
    const w2 = document.getElementById('shape-word2').value.trim();

    if(!c1 || !p1 || !w1 || !c2 || !p2 || !w2) return alert('請完整填寫字形對照組！');

    db.shapePairs.push({
        id: 's_' + Date.now(),
        item1: { char: c1, pron: p1, word: w1 },
        item2: { char: c2, pron: p2, word: w2 },
        streak: 0, wrongCount: 0
    });

    saveData();
    alert('字形對照組新增成功！');
    ['shape-char1','shape-pron1','shape-word1','shape-char2','shape-pron2','shape-word2'].forEach(id => document.getElementById(id).value = '');
}

let currentQuiz = { total: 0, currentIdx: 0, cat: 'all', typeSetting: 'random', currentQ: null, selectedOptions: [] };

function startQuiz() {
    if (db.phonetic.length < 2 && db.shapePairs.length < 2) return alert('題庫資料不足！');

    currentQuiz.cat = document.getElementById('quiz-cat-select').value;
    currentQuiz.typeSetting = document.getElementById('quiz-type-select').value;
    currentQuiz.total = parseInt(document.getElementById('quiz-amount-select').value);
    currentQuiz.currentIdx = 0;

    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('quiz-panel').style.display = 'block';

    generateNextQuestion();
}

function getWeightedRandomItem(list) {
    let validList = list.filter(item => item.streak < 5);
    if (validList.length === 0) validList = list;

    let pool = [];
    validList.forEach(item => {
        let weight = 1 + ((item.wrongCount || 0) * 2);
        for(let i=0; i<weight; i++) pool.push(item);
    });

    return pool[Math.floor(Math.random() * pool.length)];
}

function generateNextQuestion() {
    if(currentQuiz.currentIdx >= currentQuiz.total) {
        alert('測驗完成！');
        location.reload();
        return;
    }

    currentQuiz.currentIdx++;
    currentQuiz.selectedOptions = [];
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('submit-btn').style.display = 'block';
    document.getElementById('quiz-progress').innerText = `題目 ${currentQuiz.currentIdx} / ${currentQuiz.total === 999 ? '不中斷' : currentQuiz.total}`;

    let type = currentQuiz.typeSetting;
    if(type === 'random') {
        let availableTypes = [];
        if(currentQuiz.cat === 'phonetic' || currentQuiz.cat === 'all') availableTypes.push(1,2,5);
        if(currentQuiz.cat === 'shape' || currentQuiz.cat === 'all') availableTypes.push(3,6);
        if(currentQuiz.cat === 'all' && db.shapePairs.length > 0) availableTypes.push(4);
        type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
    } else {
        type = parseInt(type);
    }

    buildQuestionView(type);
}

function buildQuestionView(type) {
    const qBox = document.getElementById('question-box');
    qBox.innerHTML = '';
    currentQuiz.currentQ = { type: type, answer: null, targetItem: null };

    if(type === 1) {
        qBox.innerHTML = '<h4>【字音單選】請選出讀音/字音類別相同的組合：</h4>';
        let item = getWeightedRandomItem(db.phonetic);
        currentQuiz.currentQ.targetItem = item;
        
        let sameCatItems = db.phonetic.filter(x => x.cat === item.cat && x.id !== item.id);
        let diffCatItems = db.phonetic.filter(x => x.cat !== item.cat);

        let correctOpt = `${item.word} / ${sameCatItems.length > 0 ? sameCatItems[0].word : item.word}`;
        let options = [{ text: correctOpt, correct: true }];

        for(let i=0; i<3; i++) {
            let rndDiff = diffCatItems[Math.floor(Math.random()*diffCatItems.length)] || item;
            options.push({ text: `${item.word} / ${rndDiff.word}`, correct: false });
        }
        options.sort(() => Math.random() - 0.5);

        currentQuiz.currentQ.answer = options.findIndex(o => o.correct);
        renderOptions(options, false);

    } else if(type === 2) {
        qBox.innerHTML = '<h4>【字音多選】請選出讀音/字音類別相同的組合（複選）：</h4>';
        let item = getWeightedRandomItem(db.phonetic);
        currentQuiz.currentQ.targetItem = item;

        let sameCatItems = db.phonetic.filter(x => x.cat === item.cat);
        let diffCatItems = db.phonetic.filter(x => x.cat !== item.cat);

        let options = [];
        let correctIndices = [];

        for(let i=0; i<5; i++) {
            let isCorrect = Math.random() > 0.5;
            if (isCorrect && sameCatItems.length >= 2) {
                let p1 = sameCatItems[Math.floor(Math.random()*sameCatItems.length)];
                let p2 = sameCatItems[Math.floor(Math.random()*sameCatItems.length)];
                options.push({ text: `${p1.word} / ${p2.word}`, correct: true });
                correctIndices.push(i);
            } else {
                let p1 = db.phonetic[Math.floor(Math.random()*db.phonetic.length)];
                let p2 = diffCatItems[Math.floor(Math.random()*diffCatItems.length)] || p1;
                options.push({ text: `${p1.word} / ${p2.word}`, correct: false });
            }
        }
        currentQuiz.currentQ.answer = correctIndices;
        renderOptions(options, true);

    } else if(type === 3) {
        qBox.innerHTML = '<h4>【字形單選】請選出字形運用完全正確的詞語：</h4>';
        let pair = getWeightedRandomItem(db.shapePairs);
        currentQuiz.currentQ.targetItem = pair;

        let options = [
            { text: pair.item1.word, correct: true },
            { text: pair.item1.word.replace(pair.item1.char, pair.item2.char), correct: false },
            { text: pair.item2.word.replace(pair.item2.char, pair.item1.char), correct: false },
            { text: pair.item2.word + "(錯)", correct: false }
        ];
        options.sort(() => Math.random() - 0.5);

        currentQuiz.currentQ.answer = options.findIndex(o => o.correct);
        renderOptions(options, false);

    } else if(type === 4) {
        qBox.innerHTML = '<h4>【改錯題】請選出「沒有錯別字」的正確選項：</h4>';
        let pair = getWeightedRandomItem(db.shapePairs);
        currentQuiz.currentQ.targetItem = pair;

        let options = [
            { text: pair.item1.word, correct: true },
            { text: pair.item1.word.replace(pair.item1.char, 'X'), correct: false },
            { text: pair.item2.word.replace(pair.item2.char, 'Y'), correct: false },
            { text: pair.item1.word + "錯", correct: false }
        ];
        options.sort(() => Math.random() - 0.5);

        currentQuiz.currentQ.answer = options.findIndex(o => o.correct);
        renderOptions(options, false);

    } else if(type === 5) {
        let item = getWeightedRandomItem(db.phonetic);
        currentQuiz.currentQ.targetItem = item;
        currentQuiz.currentQ.answer = item.pron;

        qBox.innerHTML = `
            <h4>【字音填空】</h4>
            <p style="font-size: 20px;">請輸入詞語 「<strong>${item.word}</strong>」 中 『<strong>${item.char}</strong>』 的讀音：</p>
            <input type="text" id="fill-answer" style="font-size:18px; padding:8px;" placeholder="請輸入讀音">
        `;

    } else if(type === 6) {
        let pair = getWeightedRandomItem(db.shapePairs);
        let item = Math.random() > 0.5 ? pair.item1 : pair.item2;
        currentQuiz.currentQ.targetItem = pair;
        currentQuiz.currentQ.answer = item.char;

        let promptWord = item.word.replace(item.char, "（＿）");
        qBox.innerHTML = `
            <h4>【字形填空】</h4>
            <p style="font-size: 20px;">請填入空格中的正確字形：<strong>${promptWord}</strong> （讀音：${item.pron}）</p>
            <input type="text" id="fill-answer" maxlength="1" style="font-size:18px; padding:8px;" placeholder="請輸入國字">
        `;
    }
}

function renderOptions(options, isMulti) {
    const qBox = document.getElementById('question-box');
    options.forEach((opt, idx) => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${['A','B','C','D','E'][idx]}. ${opt.text}`;
        btn.onclick = () => {
            if(isMulti) {
                btn.classList.toggle('selected');
                if(currentQuiz.selectedOptions.includes(idx)) {
                    currentQuiz.selectedOptions = currentQuiz.selectedOptions.filter(i => i !== idx);
                } else {
                    currentQuiz.selectedOptions.push(idx);
                }
            } else {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                currentQuiz.selectedOptions = [idx];
            }
        };
        qBox.appendChild(btn);
    });
}

function submitAnswer() {
    const q = currentQuiz.currentQ;
    let isCorrect = false;

    if(q.type === 5 || q.type === 6) {
        let userAns = document.getElementById('fill-answer').value.trim();
        isCorrect = (userAns === q.answer);
    } else if(q.type === 2) {
        let userSet = new Set(currentQuiz.selectedOptions);
        let ansSet = new Set(q.answer);
        isCorrect = userSet.size === ansSet.size && [...userSet].every(x => ansSet.has(x));
    } else {
        isCorrect = currentQuiz.selectedOptions.length > 0 && currentQuiz.selectedOptions[0] === q.answer;
    }

    let target = q.targetItem;
    if(isCorrect) {
        target.streak = (target.streak || 0) + 1;
    } else {
        target.streak = 0;
        target.wrongCount = (target.wrongCount || 0) + 1;
    }
    saveData();

    let resBox = document.getElementById('result-box');
    let resText = document.getElementById('result-text');
    resBox.style.display = 'block';
    document.getElementById('submit-btn').style.display = 'none';

    if(isCorrect) {
        resBox.className = "result-box correct";
        resText.innerHTML = `<strong>恭喜答對！</strong> (連續答對次數：${target.streak}/5)`;
    } else {
        resBox.className = "result-box wrong";
        let correctAnsText = q.answer;
        if(Array.isArray(q.answer)) correctAnsText = q.answer.map(i => ['A','B','C','D','E'][i]).join(', ');
        else if(typeof q.answer === 'number') correctAnsText = ['A','B','C','D','E'][q.answer];
        
        resText.innerHTML = `<strong>答錯了！</strong><br>正確答案為：<b>${correctAnsText}</b>`;
    }
}

function nextQuestion() {
    generateNextQuestion();
}
</script>
