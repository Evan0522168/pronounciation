<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國語字音自主練習</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17253d;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px}
.wrap{max-width:730px;margin:auto}
h1{font-size:clamp(23px,5vw,30px);margin:8px 0 5px}
.sub{color:#53647c;margin:0 0 22px;line-height:1.6}
.tabs,.actions,.tools{display:flex;gap:10px;flex-wrap:wrap}
.tabs{margin:0 0 15px}
button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:11px 16px;font-weight:650}
button:focus-visible,textarea:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.tab{background:#dfe7f3;color:#354760}
.tab[aria-selected=true]{background:#2563eb;color:white}
.panel{background:white;border:1px solid #e1e8f1;border-radius:19px;padding:clamp(18px,5vw,30px);box-shadow:0 12px 30px #23314d0b}
.hidden{display:none!important}
.counts{display:flex;justify-content:space-between;gap:8px;color:#486079;font-size:14px}
.card{display:block;width:100%;min-height:220px;background:#f8fbff;border:2px solid #dce8fa;margin:18px 0;text-align:center;color:#17253d}
.card .word{display:block;font-size:clamp(32px,8vw,49px);font-weight:750;line-height:1.35}
.card .hint{display:block;color:#60728a;font-size:14px;margin-top:12px}
.card.revealed{background:#eaf3ff}
.actions button{flex:1;min-width:135px}
.red{background:#e54848;color:white}
.green{background:#07976d;color:white}
.dark{background:#26384f;color:white}
.secondary{background:#e5ecf5;color:#26384f}
.tools{margin-top:23px;padding-top:20px;border-top:1px solid #e2e8f0}
.tools>div{width:100%}
textarea{width:100%;min-height:130px;border:1px solid #bdc9d9;border-radius:10px;padding:12px;font:14px/1.6 ui-monospace,monospace;resize:vertical}
label{font-weight:650;display:block;margin-bottom:8px}
.note,.status{font-size:13px;color:#53647c;line-height:1.6;margin:10px 0}
.status{min-height:1.5em}
.question{text-align:center;background:#f8fbff;border:2px solid #dce8fa;border-radius:14px;padding:28px 16px;font-size:clamp(22px,5vw,29px);font-weight:700;line-height:1.7;margin:18px 0}
.target{color:#175dc9;text-decoration:underline;text-underline-offset:5px}
.answer{border-radius:12px;padding:17px;background:#ecfdf5;line-height:1.8;margin-top:20px}
.answer.wrong{background:#fff0f0}
.answer p{margin:5px 0}
.footer{margin-top:18px;color:#60728a;font-size:13px;line-height:1.7}
.footer a{color:#1558c1}
</style>
</head>
<body>
<main class="wrap">
  <h1>國語字音自主練習</h1>
  <p class="sub">先看詞組想讀音，選擇「已學會」或「再練一次」後顯示答案，再進入下一張；是非題比較兩個標示字的讀音。</p>

  <div class="tabs" role="tablist">
    <button id="tab-card" class="tab" role="tab" aria-selected="true" aria-controls="panel-card">閃卡</button>
    <button id="tab-quiz" class="tab" role="tab" aria-selected="false" aria-controls="panel-quiz">是非題</button>
  </div>

  <section class="panel" id="panel-card" role="tabpanel" aria-labelledby="tab-card">
    <div class="counts">
      <span id="pending">待複習：0</span>
      <span id="done">已學會：0</span>
    </div>
    <button class="card" id="card" aria-label="翻開閃卡">
      <span class="word" id="card-word"></span>
      <span class="hint" id="card-hint"></span>
    </button>
    <div class="actions">
      <button class="red" id="again">再練一次</button>
      <button class="green" id="know">已學會</button>
    </div>
    <button id="next-card" class="dark hidden" style="width:100%;margin-top:12px">下一張</button>

    <div class="tools">
      <div>
        <label for="input">匯入／匯出待複習字音</label>
        <textarea id="input" placeholder="每行一組，例如：峻浚悛；或「峻|ㄐㄩㄣˋ|嚴峻 浚|ㄐㄩㄣˋ|浚渫」"></textarea>
        <p class="note">匯出只包含待複習項目，格式為「字｜注音｜詞組」，可直接貼回載入。匯入只接受內建題庫中已核對的詞組與讀音，未確認的新資料不會自動出題。進度會儲存在這台裝置的瀏覽器。</p>
        <div class="actions">
          <button class="secondary" id="export">匯出待複習</button>
          <button class="secondary" id="import">載入文字</button>
          <button class="secondary" id="reset">重設為完整題庫</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </div>
    </div>
  </section>

  <section class="panel hidden" id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz">
    <div class="counts">
      <span id="quiz-count">第 1 題</span>
      <span id="quiz-score">答對 0 題</span>
    </div>
    <p class="sub">標示的兩個字，讀音是否相同？</p>
    <div class="question" id="question"></div>
    <div class="actions" id="choices">
      <button class="green" id="same">⭕ 相同</button>
      <button class="red" id="different">❌ 不同</button>
    </div>
    <div id="feedback" class="answer hidden" aria-live="polite"></div>
    <button id="next" class="dark hidden" style="width:100%;margin-top:14px">下一題</button>
  </section>

  <p class="footer">
    字音以教育部辭典為校對基準；罕見字與古籍語詞請依所考詞義核對。
    <a href="https://dict.concised.moe.edu.tw/" target="_blank" rel="noopener">國語辭典簡編本</a> ·
    <a href="https://dict.revised.moe.edu.tw/" target="_blank" rel="noopener">重編國語辭典修訂本</a>
  </p>
</main>

function parse(text) {
  let clusters = [], unknown = [];
  for (const line of text.split(/\r?\n/)) {
    let source = line.trim();
    if (!source || source === '字音') continue;
    let row = [];
    let tokens = source.includes('|')
      ? source.split(/\s+/)
      : source.match(/[^（）／\s]+(?:（[^）]+）)?/gu) || [];

    for (const token of tokens) {
      if (token.includes('|')) {
        let [char, reading, phrase] = token.split('|');
        if (char && reading && phrase && phrase.includes(char) &&
            /^[\u3105-\u3129˙ˊˇˋ]+$/.test(reading)) {
          let known = base.flat().find(x =>
            x.char === char && x.reading === reading && x.phrase === phrase
          );
          if (known) row.push(known);
          else unknown.push(token);
        } else {
          unknown.push(token);
        }
      } else {
        let parts = token.match(/^([^（]+)(?:（(.+)）)?$/u);
        if (!parts) continue;
        let chars = [...parts[1]];
        let contexts = parts[2]?.split('／') || [];

        for (let char of chars) {
          let choices = base.flat().filter(x => x.char === char);
          if (!choices.length) {
            unknown.push(char);
            continue;
          }
          let relevant = contexts.filter(p => p.includes(char));
          let selected = relevant.length
            ? choices.filter(x => relevant.some(p =>
                x.phrase === p || x.phrase.includes(p)))
            : choices.filter(x => choices.length === 1 || x.phrase === char);
          if (!selected.length) {
            unknown.push(token);
            continue;
          }
          row.push(...selected);
        }
      }
    }
    if (row.length) clusters.push(row);
  }
  return {clusters, unknown};
}

const base = DATA.split('\n').map(line =>
  line.split(/\s+/).map(token => {
    let [char, reading, phrase] = token.split('|');
    return {char, reading, phrase};
  })
);

let clusters = [], pending = [], done = [], index = 0;
let selectedAnswer = null, quiz = null, quizN = 0, correctN = 0;
let seenQuestions = new Set();

const key = x => [x.char, x.reading, x.phrase].join('|');

function unique(items) {
  let set = new Set();
  return items.filter(x => {
    let k = key(x);
    if (set.has(k)) return false;
    set.add(k);
    return true;
  });
}

function save() {
  try {
    localStorage.setItem(savedKey, JSON.stringify({
      clusters, pending, done, index, quizN, correctN
    }));
  } catch {
    setStatus('此瀏覽器無法儲存進度；請定期匯出。');
  }
}

function setStatus(s) {
  $('status').textContent = s;
}

function restore() {
  try {
    let s = JSON.parse(localStorage.getItem(savedKey));
    if (s && Array.isArray(s.pending) &&
        Array.isArray(s.clusters) && Array.isArray(s.done)) {
      clusters = s.clusters;
      pending = s.pending;
      done = s.done;
      index = s.index || 0;
      quizN = s.quizN || 0;
      correctN = s.correctN || 0;
      return;
    }
  } catch {}
  clusters = base;
  pending = unique(base.flat());
  done = [];
}

function revealCard(x) {
  $('card').classList.add('revealed');
  $('card-word').textContent = x.reading;
  $('card-hint').textContent =
    `「${x.char}」・${x.phrase}${NOTES[key(x)] ? '；' + NOTES[key(x)] : ''}`;
}

function card() {
  selectedAnswer = null;
  index = Math.min(index, Math.max(0, pending.length - 1));
  $('pending').textContent = `待複習：${pending.length}`;
  $('done').textContent = `已學會：${done.length}`;
  let x = pending[index];
  $('card').classList.remove('revealed');
  $('card-word').textContent = x ? x.phrase : '🎉 全部學會';
  $('card-hint').textContent = x
    ? '點此顯示讀音'
    : '可以重設題庫，或匯入下一批';
  $('again').disabled = $('know').disabled = !x;
  $('next-card').classList.add('hidden');
  save();
}

$('card').onclick = () => {
  let x = pending[index];
  if (!x) return;
  if (selectedAnswer !== null) {
    revealCard(x);
    return;
  }
  let isOpen = $('card').classList.toggle('revealed');
  $('card-word').textContent = isOpen ? x.reading : x.phrase;
  $('card-hint').textContent = isOpen
    ? `「${x.char}」・${x.phrase}${NOTES[key(x)] ? '；' + NOTES[key(x)] : ''}`
    : '點此顯示讀音';
};

function answer(known) {
  let x = pending[index];
  if (!x || selectedAnswer !== null) return;
  selectedAnswer = known;
  revealCard(x);
  $('card-hint').textContent += known
    ? '；已標記「已學會」'
    : '；已標記「再練一次」';
  $('again').disabled = $('know').disabled = true;
  $('next-card').classList.remove('hidden');
}

$('again').onclick = () => answer(false);
$('know').onclick = () => answer(true);

$('next-card').onclick = () => {
  if (selectedAnswer === null) return;
  let x = pending.splice(index, 1)[0];
  if (selectedAnswer) done.push(x);
  else pending.push(x);
  card();
};

function exportPending() {
  let content = base.map(row =>
    row.filter(x => pending.some(y => key(x) === key(y)))
       .map(key).join(' ')
  ).filter(Boolean).join('\n');
  let extras = pending.filter(x =>
    !base.flat().some(y => key(x) === key(y))
  ).map(key);

  $('input').value = [content, ...extras].filter(Boolean).join('\n');
  $('input').focus();
  $('input').select();

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText($('input').value).then(
      () => setStatus('已複製待複習項目。'),
      () => setStatus('文字已選取，請手動複製。')
    );
  } else {
    setStatus('文字已選取，請手動複製。');
  }
}
$('export').onclick = exportPending;

$('import').onclick = () => {
  let raw = $('input').value.trim();
  if (!raw) {
    setStatus('請先貼上資料。');
    return;
  }
  let result = parse(raw);
  if (!result.clusters.length) {
    setStatus('沒有可辨識的已知字音；請用「字|注音|詞組」格式。');
    return;
  }
  clusters = result.clusters;
  pending = unique(clusters.flat());
  done = [];
  index = 0;
  seenQuestions.clear();
  quizN = correctN = 0;
  card();
  generate();
  setStatus(result.unknown.length
    ? `已載入 ${pending.length} 項；${result.unknown.length} 個未確認項目未加入題庫：${[...new Set(result.unknown)].slice(0,8).join('、')}${result.unknown.length > 8 ? '…' : ''}`
    : `已載入 ${pending.length} 項。`);
};

$('reset').onclick = () => {
  clusters = base;
  pending = unique(base.flat());
  done = [];
  index = 0;
  quizN = correctN = 0;
  seenQuestions.clear();
  card();
  generate();
  setStatus('已重設為完整題庫。');
};

const NOTES = {
  '咯|ㄎㄚˇ|咯血': '《簡編本》ㄎㄚˇ；《重編本》另列 ㄌㄨㄛˋ。',
  '驁|ㄠˊ|桀驁': '《簡編本》ㄠˊ；《重編本》詞條列 ㄠˋ（又音）。',
  '畦|ㄑㄧˊ|田畦': '《簡編本》ㄑㄧˊ；《重編本》列語音 ㄑㄧˊ、讀音 ㄒㄧ。',
  '瞿|ㄑㄩ|瞿先生': '《重編本》姓氏正讀 ㄑㄩ，另列 ㄑㄩˊ 為又音。'
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c])
  );
}

function label(x) {
  let at = x.phrase.indexOf(x.char);
  return at < 0
    ? `<span class="target">${escapeHtml(x.char)}</span> ${escapeHtml(x.phrase)}`
    : escapeHtml(x.phrase.slice(0, at)) +
      `<span class="target">${escapeHtml(x.char)}</span>` +
      escapeHtml(x.phrase.slice(at + x.char.length));
}

function allPairs() {
  let pairs = [];
  for (const row of clusters) {
    let u = unique(row);
    for (let i = 0; i < u.length; i++) {
      for (let j = i + 1; j < u.length; j++) {
        if (u[i].reading && u[j].reading) pairs.push([u[i], u[j]]);
      }
    }
  }
  return pairs;
}

function generate() {
  let pairs = allPairs();
  $('feedback').classList.add('hidden');
  $('next').classList.add('hidden');
  $('quiz-count').textContent = `第 ${quizN + 1} 題`;
  $('quiz-score').textContent = `答對 ${correctN} 題`;

  if (!pairs.length) {
    quiz = null;
    $('question').textContent = '至少需要一組含兩個已知讀音的字詞';
    $('choices').classList.add('hidden');
    return;
  }

  let unused = pairs.filter(([a,b]) =>
    !seenQuestions.has(key(a) + '/' + key(b))
  );
  if (!unused.length) {
    seenQuestions.clear();
    unused = pairs;
  }

  let [a,b] = unused[Math.floor(Math.random() * unused.length)];
  seenQuestions.add(key(a) + '/' + key(b));
  quiz = {a, b, same: a.reading === b.reading};
  $('question').innerHTML = `${label(a)}<br>／<br>${label(b)}`;
  $('choices').classList.remove('hidden');
}

function submit(choice) {
  if (!quiz) return;
  quizN++;
  let good = choice === quiz.same;
  if (good) correctN++;

  let f = $('feedback');
  f.className = 'answer' + (good ? '' : ' wrong');
  f.innerHTML = `
    <strong>${good ? '⭕ 答對了' : '❌ 答錯了'}</strong>
    <p>「${escapeHtml(quiz.a.char)}」（${escapeHtml(quiz.a.phrase)}）：${escapeHtml(quiz.a.reading)}</p>
    <p>「${escapeHtml(quiz.b.char)}」（${escapeHtml(quiz.b.phrase)}）：${escapeHtml(quiz.b.reading)}</p>
    <p>正確答案：${quiz.same ? '相同' : '不同'}</p>
    ${[quiz.a, quiz.b].map(x => NOTES[key(x)]
      ? `<p>讀音註記：${escapeHtml(NOTES[key(x)])}</p>`
      : '').join('')}
  `;

  $('choices').classList.add('hidden');
  $('next').classList.remove('hidden');
  $('quiz-score').textContent = `答對 ${correctN}／${quizN} 題`;
  save();
}

$('same').onclick = () => submit(true);
$('different').onclick = () => submit(false);
$('next').onclick = generate;

for (const [name, other] of [['card','quiz'], ['quiz','card']]) {
  $('tab-' + name).onclick = () => {
    $('panel-' + name).classList.remove('hidden');
    $('panel-' + other).classList.add('hidden');
    $('tab-' + name).setAttribute('aria-selected', 'true');
    $('tab-' + other).setAttribute('aria-selected', 'false');
  };
}

restore();
card();
generate();
</script>
</body>
</html>
